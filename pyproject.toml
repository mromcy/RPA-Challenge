[tool.poetry]
name = "RPA_Challenge"
version = "0.1.0"
package-mode = false
description = ""
authors = ["Marco Romcy <marcoromcy@gmail.com>"]
readme = "README.md"
packages = [{include = "resources"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
alembic = "^1.17.0"
cryptography = "^46.0.2"
botcity-maestro-sdk = "^0.9.0"
pydantic-settings = "^2.11.0"
psycopg = {version = "3.2.9", extras = ["binary"]}
pytz = "^2025.2"
playwright = "^1.58.0"
pandas = "^3.0.1"
openpyxl = "^3.1.5"


[tool.ruff]
line-length = 90
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check .&& ruff check . --diff'
format = 'ruff check . --fix&& ruff format .'
run = ' python bot.py'
pre_test = 'task lint'
test = 'pytest --cov=validacao_produtos_valores -vv'
post_test = 'coverage html'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"
taskipy = "^1.14.1"
pytest = "^9.0.0"
pytest-cov = "^7.1.0"