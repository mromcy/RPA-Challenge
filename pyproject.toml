[project]
name = "rpa-challenge"
version = "0.1.0"
description = "Production-style RPA bot that solves rpachallenge.com, with queue-based item state tracking in PostgreSQL, Alembic migrations and Fernet-encrypted credentials."
authors = [{ name = "Marco Romcy", email = "marcoromcy@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.17.0,<2.0.0",
    "botcity-maestro-sdk>=0.9.0,<0.10.0",
    "cryptography>=46.0.2,<47.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=3.0.1,<4.0.0",
    "playwright>=1.58.0,<2.0.0",
    "psycopg[binary]==3.2.9",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "pytz>=2025.2,<2026.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "selenium (>=4.46.0,<5.0.0)",
]

# Poetry-specific behaviour, not standard metadata: this is an application, never a
# published package, so Poetry manages the virtualenv without building the project.
[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 90
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
# Registering the marker makes pytest refuse an unknown label: without it, a
# mistyped @pytest.mark.e2ee would create a test that never runs.
markers = [
    "e2e: full flow against the live rpachallenge.com; needs network and a browser",
]

[tool.taskipy.tasks]
lint = 'ruff check .'
format = 'ruff check . --fix --exit-zero && ruff format .'
run = 'python bot.py'
# Poetry is a development tool; whoever only wants to run the bot installs
# from requirements.txt, which is also what the BotCity runner consumes.
export = 'poetry export -f requirements.txt --output requirements.txt --without-hashes'
# The dev one includes ruff, pytest and taskipy: without it, whoever clones
# with pip cannot run the suite - which is exactly what a reviewer wants to do.
export-dev = 'poetry export --with dev -f requirements.txt --output requirements-dev.txt --without-hashes'
pre_test = 'task lint'
# The fast lane excludes e2e: no network, no browser, runs on every change.
test = 'pytest -m "not e2e" --cov=resources -vv'
post_test = 'coverage html'
# The slow lane, on demand: starts a browser and depends on the site being up.
e2e = 'pytest -m e2e -vv'
# The driver comparison. Manual, outside CI, requires PATH_BROWSER.
benchmark = 'python -m benchmarks.compare_drivers'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"
taskipy = "^1.14.1"
pytest = "^9.0.0"
pytest-cov = "^7.1.0"